name: MailPortal release

on:
  push:
    tags:
      - 'v*-mp.*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release coordinates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow against the MailPortal release tag." >&2
            exit 1
          fi

          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$cargo_version" || "$GITHUB_REF_NAME" != "v${cargo_version}-mp."* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $cargo_version." >&2
            exit 1
          fi

          artifact="vandelay-${GITHUB_REF_NAME#v}-linux-x86_64"
          echo "CARGO_VERSION=$cargo_version" >> "$GITHUB_ENV"
          echo "RELEASE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Update Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Build MailPortal binary
        shell: bash
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Verify and checksum artifact
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 target/x86_64-unknown-linux-gnu/release/vandelay "$RELEASE_ARTIFACT"
          version=$(./"$RELEASE_ARTIFACT" --version)
          if [[ "$version" != *"$CARGO_VERSION"* ]]; then
            echo "Built binary reports unexpected version: $version" >&2
            exit 1
          fi
          sha256sum "$RELEASE_ARTIFACT" > "$RELEASE_ARTIFACT.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.RELEASE_ARTIFACT }}

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## \[/{c++} c==1' CHANGELOG.md > "$RUNNER_TEMP/notes.txt"
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME (MailPortal patched)" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            "$RELEASE_ARTIFACT" "$RELEASE_ARTIFACT.sha256"
