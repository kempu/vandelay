[package]
name = "vandelay"
description = "JMAP account migration utility"
version = "1.0.7"
authors = ["Stalwart Labs LLC <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/vandelay"
homepage = "https://github.com/stalwartlabs/vandelay"
edition = "2024"
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "5C8148E7-34A9-4216-A802-FFB8345AECC4"
path-guid = "FA9E97EB-5E5C-4809-9018-9DC1EDB0E93D"
license = false
eula = false

[[bin]]
name = "vandelay"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
indexmap = { version = "=2.14.2", features = ["serde"] }
rusqlite = { version = "=0.41.1", features = ["blob"] }
blake3 = "=1.8.5"
time = { version = "=0.3.55", features = ["serde-well-known", "macros"] }
url= "=2.5.8"
thiserror  = "=2.0.21"
ureq = { version = "=3.3.0", default-features = false, features = ["json", "gzip", "rustls-no-provider", "platform-verifier"] }
clap = { version = "=4.6.4", features = ["derive"] }
crossbeam-channel = "=0.5.16"
num_cpus = "=1.17.0"
base64 = "=0.22.1"
mail-parser = "=0.11.5"
calcard = "=0.3.7"
rustls = { version = "=0.23.42", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.0"
regex  = "=1.13.1"
flate2 = "=1.1.9"
quick-xml = "=0.41.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false }

[dev-dependencies]
mockito = "=1.7.2"
tempfile = "=3.27.0"
testcontainers = { version = "=0.27.3", features = ["blocking"] }

[profile.dist]
inherits = "release"
lto = "thin"
